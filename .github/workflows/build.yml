name: Java CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build JAR
        run: ./gradlew :velocity:shadowJar --build-cache

      - name: Upload JAR
        uses: actions/upload-artifact@v7
        with:
          name: MultiLogin-Velocity
          path: velocity/build/libs/MultiLogin-Velocity-*.jar
          if-no-files-found: error
          archive: false
